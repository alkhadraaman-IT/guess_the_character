name: guess_the_character
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  excel: ^4.0.0
  file_picker: ^8.0.0
  path_provider: ^2.1.5
  share_plus: ^10.1.3
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.jpg"
  web:
    generate: true
    image_path: "assets/logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/

  fonts:
    - family: Marhey
      fonts:
        - asset: assets/fonts/Marhey/Marhey-VariableFont_wght.ttf
